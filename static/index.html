<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>器官分配协调台</title>
<style>body{font:15px system-ui;max-width:1080px;margin:40px auto;background:#f5f7fb;padding:0 20px;color:#172033}section{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px #0001;margin-bottom:16px}pre{background:#0f172a;color:#86efac;padding:16px;overflow:auto;border-radius:8px}input,button{font:inherit;padding:8px;margin:4px}button{background:#be123c;color:white;border:0;border-radius:6px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e2e8f0;padding:6px 8px;text-align:left;font-size:14px}th{color:#64748b}</style>
<h1>器官分配协调台</h1><p>查看当前可用器官、候选患者和分配进度。写操作通过 JSON API 完成，医院接口需携带 X-Hospital。</p><section><input id="u" value="allocator"><input id="r" value="allocation_officer"><button onclick="load()">刷新</button><pre id="o"></pre></section>
<section><h2>转运拒收与改派记录</h2><table><thead><tr><th>时间</th><th>原医院</th><th>拒收原因</th><th>新医院</th><th>操作人</th><th>原单</th><th>新单</th></tr></thead><tbody id="rs"></tbody></table></section>
<script>async function load(){let r=await fetch('/api/state',{headers:{'X-User-Id':u.value,'X-Role':r.value}});o.textContent=JSON.stringify(await r.json(),null,2);let q=await fetch('/api/reassignments',{headers:{'X-User-Id':u.value,'X-Role':r.value}});let rows=q.ok?(await q.json()).reassignments:[];rs.innerHTML=rows.map(x=>`<tr><td>${x.reassigned_at}</td><td>${x.from_hospital}</td><td>${x.reason}</td><td>${x.to_hospital}</td><td>${x.reassigned_by}（拒收：${x.rejected_by}）</td><td>#${x.old_allocation_id}</td><td>#${x.new_allocation_id}</td></tr>`).join('')||'<tr><td colspan=7>暂无改派记录</td></tr>'}load()</script>
